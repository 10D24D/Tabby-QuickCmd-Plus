# 创建人: DD1024z + Hy3; 创建时间: 2026-10-23
# 功能需求（中文）。
# ⛔ 本文件与 feature_request_en.yml 的**字段 id 必须完全一致**
#   （os_version / tabby_version / qc_plus_version / scenario / expected / extra）。
name: 功能需求
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请尽量说明使用场景与期望行为。

  - type: input
    id: os_version
    attributes:
      label: 系统版本信息
      description: 例如 Windows 11 24H2 / macOS 15.1 / Ubuntu 24.04
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: tabby_version
    attributes:
      label: Tabby 版本信息
      description: 可在 Tabby → About / 关于 中查看
      placeholder: 1.0.2xx
    validations:
      required: true

  - type: input
    id: qc_plus_version
    attributes:
      label: QuickCmd+ 插件版本
      description: 可在设置页「关于」区或发布页查看
      placeholder: 2.0.0
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？现在的做法有什么不便？
      placeholder: |
        我在……的时候，希望能……
        目前只能……，比较麻烦。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望插件怎么表现？（可描述交互、按钮位置、文案等）
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选）
      description: 参考截图、类似工具的做法、其他想法等
    validations:
      required: false
