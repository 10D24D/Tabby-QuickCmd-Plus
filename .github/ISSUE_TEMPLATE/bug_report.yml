# 创建人: DD1024z + Hy3; 创建时间: 2026-10-23
# 缺陷报告（中文）。
# ⛔ 本文件与 bug_report_en.yml 的**字段 id 必须完全一致** —— 插件「报告问题」入口按 id 注入 URL query 预填，
#   错一侧会导致切语言后预填静默失效。改完跑 .workbuddy/verify/issue-template-check.mjs tabby-QuickCmd+
name: 缺陷报告
description: 报告 Bug（请尽量填全环境与复现步骤）
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供完整信息，方便快速定位问题。

  - type: input
    id: os_version
    attributes:
      label: 系统版本信息
      description: 例如 Windows 11 24H2 / macOS 15.1 / Ubuntu 24.04
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: tabby_version
    attributes:
      label: Tabby 版本信息
      description: 可在 Tabby → About / 关于 中查看
      placeholder: 1.0.2xx
    validations:
      required: true

  - type: input
    id: qc_plus_version
    attributes:
      label: QuickCmd+ 插件版本
      description: 可在设置页「关于」区或发布页查看
      placeholder: 2.0.0
    validations:
      required: true

  # 以下两项由插件「报告问题」入口自动预填（URL query 参数按字段 id 注入）
  - type: input
    id: tabby_frontend
    attributes:
      label: Tabby 前端
      description: 设置 → 外观 → 前端（如 xterm-webgl / xterm.js / vte）
      placeholder: xterm-webgl
    validations:
      required: false

  - type: input
    id: installed_plugins
    attributes:
      label: 已安装插件
      description: 插件列表，便于判断插件间冲突
      placeholder: tabby-quick-command-plus@2.0.0, tabby-sftp-plus@3.0.0
    validations:
      required: false

  - type: textarea
    id: steps_actual
    attributes:
      label: 复现步骤与实际现象
      description: 你做了哪些操作，以及现在实际发生了什么？（可贴报错文案、截图说明）
      placeholder: |
        1. 打开……
        2. 点击……
        3. 输入……

        结果：……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 按理说应该怎样才对？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可选）
      description: 粘贴日志即可，会自动按代码块展示
      render: shell
    validations:
      required: false
