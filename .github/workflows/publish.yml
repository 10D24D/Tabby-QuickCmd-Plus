# 创建人: DD1024z + Hy3; 创建时间: 2026-10-23
#
# GitHub Actions → npm 自动发布（与 SFTP+ 同一套链路）
# 触发条件：创建 GitHub Release 时自动发布到 npm
# 使用 npm Trusted Publisher（OIDC），无需 Token，绕过 2FA
#
# 一次性配置（在 npmjs.com 该包 → Settings → Trusted Publisher 里添加）：
#   Publisher: GitHub Actions
#   Repository: 10D24D/Tabby-QuickCmd-Plus
#   Workflow:   publish.yml
#   Environment: 留空
#
# 发布流程：
#   1. bump 版本号（package.json / package-lock / CHANGELOG / README 齐改）并 npm run build
#   2. git push && git push --tags
#   3. 在 GitHub 仓库页面创建 Release（关联已有 tag）
#   4. Release published 事件触发本 workflow，自动发布到 npm
#
# 注意：仅通过 release 事件触发，避免 push tag + create Release 导致重复执行。
name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC 认证需要

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # prebuild 会跑 check-common-sync：单仓库/CI 环境只校验仓库内 tabby-plugin-common 副本
      - name: Install dependencies
        run: npm ci

      - name: Check whether version already exists
        id: version
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.exists != 'true'
        run: npm run build

      - name: Publish
        if: steps.version.outputs.exists != 'true'
        run: npm publish --access public --provenance
